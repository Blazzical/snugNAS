version: 2

project_name: snugnas

before:
  hooks:
    - go mod tidy

builds:
  - id: snugnas
    main: ./cmd/snugnas
    binary: snugnas
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      # ARM64 Windows isn't a target audience for snugNAS yet.
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/Blazzical/snugNAS/internal/buildinfo.Version={{ .Version }}

archives:
  - id: default
    name_template: >-
      snugnas_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - docs/**/*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: Blazzical
    name: snugNAS
  draft: true # safety: never publish without an explicit "Publish release" click
  name_template: "v{{ .Version }}"
