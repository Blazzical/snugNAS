name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # needed to create the GitHub release and upload assets

jobs:
  goreleaser:
    name: Cross-platform binaries (GoReleaser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  installer:
    name: Windows NSIS installer
    needs: goreleaser
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Derive version from tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files (x86)\NSIS;" + $env:PATH
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            Write-Host "NSIS not preinstalled — installing via chocolatey..."
            choco install nsis -y --no-progress
            echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
          } else {
            echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
            Write-Host "NSIS already available"
          }
          makensis /VERSION

      - name: Build snugnas.exe
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          $ldflags = "-s -w -X github.com/Blazzical/snugNAS/internal/buildinfo.Version=$v"
          go build -ldflags $ldflags -o snugnas.exe .\cmd\snugnas
          .\snugnas.exe --version

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          makensis "/DAPP_VERSION=$v" "/DAPP_VERSION_NUMERIC=$v.0" installer\snugnas.nsi
          Get-Item installer\snugnas-setup.exe | Format-List Name, Length

      - name: Rename installer to include version
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          $dst = "installer\snugnas_${v}_Setup_x86_64.exe"
          Move-Item installer\snugnas-setup.exe $dst
          Get-Item $dst | Format-List Name, Length

      - name: Upload installer to release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.version.outputs.value }}"
          $asset = "installer\snugnas_${v}_Setup_x86_64.exe"
          # The GoReleaser job creates the release as a draft. --clobber lets us
          # rerun if the workflow is re-triggered on the same tag.
          gh release upload "${{ github.ref_name }}" $asset --clobber
